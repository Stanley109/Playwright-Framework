<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Playwright Analytics</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 28px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Playwright Analytics</h1>
    <p class="subtitle">Day 2 — Overview</p>

    <h2>Latest Run</h2>

    <div class="cards">

        <div class="card">
            <div class="card-title">Pass Rate</div>
            <div class="card-value">87.5%</div>
        </div>

        <div class="card">
            <div class="card-title">Passed</div>
            <div class="card-value">7</div>
        </div>

        <div class="card">
            <div class="card-title">Failed</div>
            <div class="card-value">0</div>
        </div>

        <div class="card">
            <div class="card-title">Flaky</div>
            <div class="card-value">1</div>
        </div>

        <div class="card">
            <div class="card-title">Skipped</div>
            <div class="card-value">0</div>
        </div>

        <div class="card">
            <div class="card-title">Duration</div>
            <div class="card-value">17.5s</div>
        </div>

    </div>

</body>
</html>
