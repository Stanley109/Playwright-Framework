name: Deploy Playwright Analytics to GitHub Pages

on:
    workflow_run:
        workflows: ["Playwright CI"]
        types: [completed]
    workflow_dispatch:
    
permissions:
        contents: read
        pages: write
        id-token: write
    
concurrency:
        group: pages
        cancel-in-progress: true

jobs:
    build:
        if: github.event_name == 'workflow_dispatch' || contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout playwright-analytics-data
              uses: actions/checkout@v4
              with:
                ref: playwright-analytics-data
            - name: Setup Pages
              uses: actions/configure-pages@v5
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                path: ./docs
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5